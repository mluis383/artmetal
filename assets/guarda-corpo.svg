<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#12151c"/>
  <!-- sky/backdrop gradient hint -->
  <rect x="0" y="0" width="800" height="360" fill="#1a2030"/>
  <!-- floor / balcony slab -->
  <rect x="0" y="440" width="800" height="160" fill="#1e232d"/>
  <rect x="0" y="440" width="800" height="10" fill="#3a4256"/>
  <!-- distant skyline hint -->
  <g fill="#232a38">
    <rect x="60" y="260" width="40" height="180"/>
    <rect x="120" y="220" width="50" height="220"/>
    <rect x="640" y="240" width="45" height="200"/>
    <rect x="700" y="200" width="55" height="240"/>
  </g>
  <!-- guarda-corpo structure: posts -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <line x1="120" y1="440" x2="120" y2="250"/>
    <line x1="280" y1="440" x2="280" y2="250"/>
    <line x1="440" y1="440" x2="440" y2="250"/>
    <line x1="600" y1="440" x2="600" y2="250"/>
  </g>
  <!-- top rail -->
  <rect x="100" y="245" width="520" height="12" rx="4" fill="#ff6b00"/>
  <!-- glass panels -->
  <g fill="#7fb3d5" opacity="0.28" stroke="#cfe3f0" stroke-width="2">
    <rect x="128" y="260" width="144" height="178"/>
    <rect x="288" y="260" width="144" height="178"/>
    <rect x="448" y="260" width="144" height="178"/>
  </g>
  <!-- glass reflections -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.35">
    <line x1="150" y1="270" x2="150" y2="420"/>
    <line x1="310" y1="270" x2="310" y2="420"/>
    <line x1="470" y1="270" x2="470" y2="420"/>
  </g>
  <!-- base clamps -->
  <g fill="#3a4256">
    <rect x="108" y="436" width="24" height="10" rx="2"/>
    <rect x="268" y="436" width="24" height="10" rx="2"/>
    <rect x="428" y="436" width="24" height="10" rx="2"/>
    <rect x="588" y="436" width="24" height="10" rx="2"/>
  </g>
</svg>
