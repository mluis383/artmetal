<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#12151c"/>
  <!-- aluminum frame -->
  <rect x="140" y="90" width="520" height="420" rx="4" fill="none" stroke="#ffffff" stroke-width="10"/>
  <!-- mullions dividing panes -->
  <line x1="400" y1="90" x2="400" y2="510" stroke="#ffffff" stroke-width="8"/>
  <line x1="140" y1="300" x2="660" y2="300" stroke="#ffffff" stroke-width="8"/>
  <!-- glass panes with subtle gradient/reflection -->
  <g>
    <rect x="150" y="100" width="240" height="190" fill="#3b6b8f" opacity="0.35"/>
    <rect x="410" y="100" width="240" height="190" fill="#4a7ba3" opacity="0.30"/>
    <rect x="150" y="310" width="240" height="190" fill="#33607e" opacity="0.35"/>
    <rect x="410" y="310" width="240" height="190" fill="#3f6f92" opacity="0.30"/>
  </g>
  <!-- diagonal reflections -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.35">
    <line x1="170" y1="270" x2="270" y2="115"/>
    <line x1="200" y1="285" x2="320" y2="115"/>
    <line x1="430" y1="270" x2="520" y2="115"/>
    <line x1="460" y1="285" x2="570" y2="115"/>
  </g>
  <!-- accent handle -->
  <rect x="392" y="270" width="16" height="60" rx="6" fill="#ff6b00"/>
</svg>
