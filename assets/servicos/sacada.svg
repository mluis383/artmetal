<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#12151c"/>
  <!-- sky -->
  <rect x="0" y="0" width="800" height="420" fill="#1a2030"/>
  <!-- distant city -->
  <g fill="#232a38">
    <rect x="40" y="260" width="46" height="160"/>
    <rect x="110" y="220" width="56" height="200"/>
    <rect x="640" y="240" width="46" height="180"/>
    <rect x="700" y="200" width="60" height="220"/>
  </g>
  <!-- floor slab -->
  <rect x="0" y="420" width="800" height="180" fill="#1e232d"/>
  <rect x="0" y="420" width="800" height="10" fill="#3a4256"/>
  <!-- retractable glass panel frame track top -->
  <rect x="90" y="150" width="620" height="10" rx="4" fill="#ff6b00"/>
  <!-- vertical mullions -->
  <g stroke="#ffffff" stroke-width="6">
    <line x1="90" y1="155" x2="90" y2="420"/>
    <line x1="220" y1="155" x2="220" y2="420"/>
    <line x1="350" y1="155" x2="350" y2="420"/>
    <line x1="480" y1="155" x2="480" y2="420"/>
    <line x1="610" y1="155" x2="610" y2="420"/>
    <line x1="710" y1="155" x2="710" y2="420"/>
  </g>
  <!-- glass panes -->
  <g fill="#7fb3d5" opacity="0.22">
    <rect x="96" y="158" width="118" height="260"/>
    <rect x="226" y="158" width="118" height="260"/>
    <rect x="356" y="158" width="118" height="260"/>
    <rect x="486" y="158" width="118" height="260"/>
    <rect x="616" y="158" width="88" height="260"/>
  </g>
  <!-- bottom track -->
  <rect x="90" y="416" width="620" height="8" fill="#3a4256"/>
</svg>
