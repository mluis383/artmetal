<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#12151c"/>
  <!-- blueprint grid -->
  <g stroke="#1e2836" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="140" y1="0" x2="140" y2="600"/>
    <line x1="220" y1="0" x2="220" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="380" y1="0" x2="380" y2="600"/>
    <line x1="460" y1="0" x2="460" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="620" y1="0" x2="620" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- technical drawing of a custom gate design -->
  <g fill="none" stroke="#ffffff" stroke-width="4">
    <rect x="230" y="150" width="340" height="260"/>
    <line x1="230" y1="220" x2="570" y2="220"/>
    <line x1="230" y1="290" x2="570" y2="290"/>
    <line x1="400" y1="150" x2="400" y2="410"/>
  </g>
  <g stroke="#ff6b00" stroke-width="3" stroke-dasharray="6,5">
    <line x1="230" y1="150" x2="570" y2="410"/>
    <line x1="570" y1="150" x2="230" y2="410"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#8a93a6" stroke-width="1.5">
    <line x1="230" y1="440" x2="570" y2="440"/>
    <line x1="230" y1="432" x2="230" y2="448"/>
    <line x1="570" y1="432" x2="570" y2="448"/>
  </g>
  <text x="400" y="465" fill="#8a93a6" font-family="monospace" font-size="18" text-anchor="middle">SOB MEDIDA</text>
  <!-- compass / tool icon -->
  <g transform="translate(600,470)" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="0" y1="0" x2="-30" y2="60"/>
    <line x1="0" y1="0" x2="30" y2="60"/>
    <circle cx="0" cy="0" r="6" fill="#ff6b00" stroke="none"/>
  </g>
</svg>
