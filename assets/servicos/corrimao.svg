<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#12151c"/>
  <!-- stair steps -->
  <g fill="#1e232d" stroke="#2c3341" stroke-width="2">
    <rect x="80" y="470" width="640" height="40"/>
    <rect x="120" y="430" width="600" height="40"/>
    <rect x="160" y="390" width="560" height="40"/>
    <rect x="200" y="350" width="520" height="40"/>
    <rect x="240" y="310" width="480" height="40"/>
    <rect x="280" y="270" width="440" height="40"/>
    <rect x="320" y="230" width="400" height="40"/>
  </g>
  <!-- step edge highlight -->
  <g stroke="#3a4256" stroke-width="2">
    <line x1="80" y1="470" x2="720" y2="470"/>
    <line x1="120" y1="430" x2="720" y2="430"/>
    <line x1="160" y1="390" x2="720" y2="390"/>
    <line x1="200" y1="350" x2="720" y2="350"/>
    <line x1="240" y1="310" x2="720" y2="310"/>
    <line x1="280" y1="270" x2="720" y2="270"/>
  </g>
  <!-- handrail posts -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="450" x2="150" y2="330"/>
    <line x1="270" y1="410" x2="270" y2="290"/>
    <line x1="390" y1="370" x2="390" y2="250"/>
    <line x1="510" y1="330" x2="510" y2="210"/>
    <line x1="630" y1="290" x2="630" y2="170"/>
  </g>
  <!-- handrail top tube (stainless) -->
  <path d="M150 330 L270 290 L390 250 L510 210 L630 170" fill="none" stroke="#ff6b00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 330 L270 290 L390 250 L510 210 L630 170" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- base plates -->
  <g fill="#3a4256">
    <rect x="138" y="448" width="24" height="8" rx="2"/>
    <rect x="258" y="408" width="24" height="8" rx="2"/>
    <rect x="378" y="368" width="24" height="8" rx="2"/>
    <rect x="498" y="328" width="24" height="8" rx="2"/>
    <rect x="618" y="288" width="24" height="8" rx="2"/>
  </g>
</svg>
