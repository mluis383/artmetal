<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#12151c"/>
  <!-- tiled wall backdrop -->
  <g stroke="#1e232d" stroke-width="2">
    <rect x="0" y="0" width="800" height="600" fill="#171b23"/>
  </g>
  <g stroke="#232a38" stroke-width="1.5">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="250" y1="0" x2="250" y2="600"/>
    <line x1="550" y1="0" x2="550" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- floor -->
  <rect x="0" y="500" width="800" height="100" fill="#20242c"/>
  <!-- box frame -->
  <rect x="220" y="90" width="360" height="410" fill="none" stroke="#ffffff" stroke-width="9"/>
  <line x1="400" y1="90" x2="400" y2="500" stroke="#ffffff" stroke-width="7"/>
  <!-- glass panels -->
  <rect x="228" y="98" width="164" height="394" fill="#bfe3f0" opacity="0.18"/>
  <rect x="408" y="98" width="164" height="394" fill="#bfe3f0" opacity="0.14"/>
  <!-- sliding rail top -->
  <rect x="210" y="80" width="380" height="12" rx="4" fill="#ff6b00"/>
  <!-- rollers -->
  <g fill="#ffffff">
    <circle cx="260" cy="86" r="7"/>
    <circle cx="360" cy="86" r="7"/>
  </g>
  <!-- handles -->
  <rect x="390" y="260" width="8" height="70" rx="3" fill="#e5e9ef"/>
  <rect x="402" y="260" width="8" height="70" rx="3" fill="#e5e9ef"/>
</svg>
